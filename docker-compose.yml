services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: epaper_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - backend/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-https://api.dogyepaper.com}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-https://dogyepaper.com}
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      EDITION_GHOSTSCRIPT_BINARY: gs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - api_storage:/var/www/backend/storage

  worker:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
      EDITION_GHOSTSCRIPT_BINARY: gs
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=900
    depends_on:
      - api
    volumes:
      - api_storage:/var/www/backend/storage

  scheduler:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    env_file:
      - backend/.env
    environment:
      DB_HOST: postgres
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    command: php artisan schedule:work
    depends_on:
      - api
    volumes:
      - api_storage:/var/www/backend/storage

  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.dogyepaper.com}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://dogyepaper.com}
        NEXT_PUBLIC_CENTRAL_HOSTS: ${NEXT_PUBLIC_CENTRAL_HOSTS:-dogyepaper.com,www.dogyepaper.com}
    ports:
      - "3000:3000"
    depends_on:
      - api

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - api
      - frontend

volumes:
  postgres_data:
  api_storage:
  caddy_data:
