[program:dogy-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/backend/artisan queue:work redis --sleep=1 --tries=3 --timeout=900 --max-time=3600
autostart=true
autorestart=true
stopwaitsecs=3600
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dogy-worker.log

[program:dogy-scheduler]
command=php /var/www/backend/artisan schedule:work
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/dogy-scheduler.log
